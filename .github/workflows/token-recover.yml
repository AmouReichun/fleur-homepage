name: Token Recover (One-Time Use)

on:
  workflow_dispatch:
    inputs:
      short_term_token:
        description: 'Graph API Explorerで発行した短期ユーザートークン'
        required: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install PyNaCl
        run: pip install PyNaCl -q

      - name: Exchange token and update GitHub Secret
        env:
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          SHORT_TERM_TOKEN: ${{ github.event.inputs.short_term_token }}
          GH_PAT: ${{ secrets.GH_PAT }}
          IG_BUSINESS_ID_FLEURAMI: ${{ secrets.IG_BUSINESS_ID_FLEURAMI }}
          IG_BUSINESS_ID_RIV: ${{ secrets.IG_BUSINESS_ID_RIV }}
          IG_BUSINESS_ID_RAFFINE: ${{ secrets.IG_BUSINESS_ID_RAFFINE }}
        run: |
          python3 << 'PYEOF'
          import json, urllib.request, urllib.parse, os, sys, base64
          from nacl import encoding, public as nacl_public

          app_id      = os.environ["META_APP_ID"]
          app_secret  = os.environ["META_APP_SECRET"]
          short_token = os.environ["SHORT_TERM_TOKEN"]
          gh_pat      = os.environ["GH_PAT"]
          owner, repo = "AmouReichun", "fleur-homepage"

          # ── 1. 短期トークンを長期トークンに交換 ──
          params = urllib.parse.urlencode({
              "grant_type":        "fb_exchange_token",
              "client_id":         app_id,
              "client_secret":     app_secret,
              "fb_exchange_token": short_token,
          })
          url = f"https://graph.facebook.com/v22.0/oauth/access_token?{params}"
          try:
              with urllib.request.urlopen(url, timeout=30) as res:
                  data = json.loads(res.read())
          except Exception as e:
              print(f"✗ Meta API エラー: {e}")
              sys.exit(1)

          new_token = data.get("access_token")
          if not new_token:
              print(f"✗ トークン取得失敗: {data}")
              sys.exit(1)

          expires_in = data.get("expires_in", 0)
          print(f"✓ 長期トークン取得成功 (有効期間: 約{expires_in // 86400}日)")

          # ── 2. 3サロンのIG疎通確認 ──
          salon_ids = {
              "fleurami": os.environ.get("IG_BUSINESS_ID_FLEURAMI", ""),
              "riv":      os.environ.get("IG_BUSINESS_ID_RIV", ""),
              "raffine":  os.environ.get("IG_BUSINESS_ID_RAFFINE", ""),
          }
          all_ok = True
          for name, ig_id in salon_ids.items():
              if not ig_id:
                  print(f"  ⚠ {name}: IG_BUSINESS_ID未設定")
                  continue
              check_url = f"https://graph.facebook.com/v22.0/{ig_id}?fields=username&access_token={new_token}"
              try:
                  with urllib.request.urlopen(check_url, timeout=15) as res:
                      info = json.loads(res.read())
                  username = info.get("username", "?")
                  print(f"  ✓ {name}: @{username}")
              except Exception as e:
                  print(f"  ✗ {name}: {e}")
                  all_ok = False

          if not all_ok:
              print("✗ IG疎通失敗あり - Secret更新を中断")
              sys.exit(1)

          # ── 3. GitHub リポジトリの公開鍵を取得 ──
          req = urllib.request.Request(
              f"https://api.github.com/repos/{owner}/{repo}/actions/secrets/public-key",
              headers={
                  "Authorization": f"token {gh_pat}",
                  "Accept": "application/vnd.github+json",
              }
          )
          with urllib.request.urlopen(req, timeout=15) as res:
              key_info = json.loads(res.read())

          # ── 4. 新トークンを暗号化 ──
          pub_key = nacl_public.PublicKey(key_info["key"].encode(), encoding.Base64Encoder())
          sealed  = nacl_public.SealedBox(pub_key).encrypt(new_token.encode())
          encrypted = base64.b64encode(sealed).decode()

          # ── 5. GitHub Secret を更新 ──
          body = json.dumps({"encrypted_value": encrypted, "key_id": key_info["key_id"]}).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{owner}/{repo}/actions/secrets/META_LONG_LIVED_TOKEN",
              data=body, method="PUT",
              headers={
                  "Authorization":  f"token {gh_pat}",
                  "Accept":         "application/vnd.github+json",
                  "Content-Type":   "application/json",
              }
          )
          with urllib.request.urlopen(req, timeout=15) as res:
              status = res.getcode()

          if status in (201, 204):
              print(f"✓ GitHub Secret META_LONG_LIVED_TOKEN 更新完了 (HTTP {status})")
          else:
              print(f"✗ Secret 更新失敗 (HTTP {status})")
              sys.exit(1)
          PYEOF
