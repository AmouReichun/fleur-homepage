name: GBP Review Auto Reply

on:
  schedule:
    # 9:00 JST (= 00:00 UTC) に毎日1回
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: content-push
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Auto reply to reviews
        run: npx tsx scripts/gbp-review-reply.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GBP_CLIENT_ID: ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
          GBP_LOCATIONS: ${{ secrets.GBP_LOCATIONS }}

      - name: Commit replied IDs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/gbp-reviews-replied.json
          if git diff --staged --quiet; then
            echo "返信なし（変更なし）"
            exit 0
          fi
          git commit -m "auto(review): GBP口コミ返信 $(date +'%Y-%m-%d')"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main
            if git push; then break; fi
            sleep $((RANDOM % 5 + 3))
          done
