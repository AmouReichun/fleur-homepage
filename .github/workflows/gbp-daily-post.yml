name: GBP Daily Post

on:
  schedule:
    # 1日2回（朝10:00 JST / 夜19:00 JST）に分散起動。各回 1件/サロン(GBP_PER_SALON=1)なので
    # 合計 2件/サロン/日。一度に6件まとめて投稿するとGBPのスパム判定を受けやすいため、
    # 朝3件・夜3件に分けてburstを回避（バックログ消化ペースは6件/日で維持）。
    # 朝夜どちらもGBP投稿のエンゲージメントが高い時間帯。
    - cron: '0 1 * * *' # 10:00 JST
    - cron: '0 10 * * *' # 19:00 JST
  workflow_dispatch:

# content-push グループで auto-publish と直列化し、ref衝突を防ぐ。
concurrency:
  group: content-push
  cancel-in-progress: false

jobs:
  gbp-daily-post:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Post to GBP
        run: npx tsx scripts/gbp-daily-post.ts
        env:
          GBP_WEBHOOK_URL: ${{ secrets.GBP_WEBHOOK_URL }}

      - name: Commit tracking file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/gbp-posted.json data/gbp-photos-posted.json
          if git diff --staged --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "gbp-daily-post: $(date +'%Y-%m-%d') GBP投稿記録"
          pushed=false
          for i in 1 2 3; do
            git pull --rebase --autostash origin main
            if git push; then pushed=true; break; fi
            echo "push衝突リトライ $i/3"
            sleep $((RANDOM % 5 + 3))
          done
          if [ "$pushed" != true ]; then
            echo "push に失敗しました" >&2
            exit 1
          fi
